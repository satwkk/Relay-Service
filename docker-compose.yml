name: relay

x-database-url: &database-url "postgres://postgres:5432/${POSTGRES_DB:-relay}?sslmode=disable"

x-app-environment: &app-environment
  POSTGRES_ADDR: postgres:5432
  DATABASE_URL: *database-url
  PGUSER: ${POSTGRES_USER:-relay}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  KAFKA_ADDR: kafka:19092
  REDIS_ADDR: redis:6379

services:

  relay-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: relay-app:dev
    environment:
      <<: *app-environment
      PORT: "8080"
    ports:
      - "127.0.0.1:${RELAY_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      relay-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/readyz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  relay-worker:
    image: relay-app:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["/app/worker"]
    environment:
      <<: *app-environment
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-500ms}
      KAFKA_PRODUCE_TIMEOUT: ${KAFKA_PRODUCE_TIMEOUT:-10s}
    depends_on:
      postgres:
        condition: service_healthy
      relay-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  relay-consumer:
    image: relay-app:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["/app/consumer"]
    environment:
      <<: *app-environment
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-relay-fanout}
      DELIVERY_POLL_INTERVAL: ${DELIVERY_POLL_INTERVAL:-500ms}
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-10s}
      DELIVERY_LEASE_DURATION: ${DELIVERY_LEASE_DURATION:-30s}
    deploy:
      replicas: ${CONSUMER_REPLICAS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      relay-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: unless-stopped

  relay-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    image: relay-migrations:dev
    environment:
      DATABASE_URL: *database-url
      PGUSER: ${POSTGRES_USER:-relay}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  kafka-storage-init:
    image: apache/kafka:4.1.2
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 1000:1000 /kafka-data"]
    volumes:
      - kafka-data:/kafka-data
    restart: "no"

  kafka-init:
    image: apache/kafka:4.1.2
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create --if-not-exists
        --topic relay.events
        --partitions 3
        --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  kafka-data:
  redis-data:
